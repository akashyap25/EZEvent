<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="210" y1="246" x2="302" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Calendar binder rings -->
  <rect x="196" y="128" width="18" height="48" rx="9" fill="#ffffff" opacity="0.85"/>
  <rect x="298" y="128" width="18" height="48" rx="9" fill="#ffffff" opacity="0.85"/>

  <!-- Calendar card -->
  <rect x="136" y="156" width="240" height="216" rx="26" fill="#ffffff"/>

  <!-- Header divider -->
