  <!-- Highlighted event day -->
  <rect x="210" y="246" width="92" height="92" rx="18" fill="url(#accentGrad)"/>
  <polyline points="234,292 258,316 300,268" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
