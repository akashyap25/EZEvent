name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  backend-checks:
    name: Backend (lint, build, test)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/eazy_event_test
      JWT_SECRET: ci-test-jwt-secret-minimum-64-characters-long-for-security-checks-0000
      SESSION_SECRET: ci-test-session-secret-32-characters!!
      CSRF_SECRET: ci-test-csrf-secret-32-characters!!!!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify app boots (no syntax/wiring errors)
        run: node -e "require('./app'); console.log('app.js loaded OK');"

      - name: Unit tests
        run: npm test

  frontend-checks:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Single required status check to reference in branch protection rules.
  all-checks-passed:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: always()
    steps:
      - name: Fail if any check failed
        run: |
          if [ "${{ needs.backend-checks.result }}" != "success" ] || [ "${{ needs.frontend-checks.result }}" != "success" ]; then
            echo "::error::One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed."
