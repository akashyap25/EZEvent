# Docker Compose — DEVELOPMENT
# Usage: docker compose -f docker-compose.dev.yml up
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.development
    environment:
      - MONGO_URI=mongodb://mongo:27017/eazy_event_dev
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    command: npm run dev
    mem_limit: 768m
    mem_reservation: 384m

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5174:5174"
    environment:
      - VITE_SERVER_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5174
    mem_limit: 768m
    mem_reservation: 384m

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m

volumes:
  mongo_dev_data:
